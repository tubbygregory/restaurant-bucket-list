name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate application scripts
        run: |
          node --test tests/*.test.cjs
          node --check location.js
          node --check navigation.js
          node --check features.js
          node --check install.js
          node --check sw.js

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and prepare public files
        run: |
          mkdir -p _site
          cp index.html features.js navigation.js location.js install.js sw.js manifest.webmanifest _site/
          cp -R icons vendor _site/
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); for (const m of s.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)) new (require('vm').Script)(m[1]);"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
